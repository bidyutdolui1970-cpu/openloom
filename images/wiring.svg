<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">OpenLoom wiring diagram</title>
  <desc id="desc">Connections from an ESP32 DevKit to an SSD1306 I2C OLED, FLIP and NEXT buttons, and an active buzzer.</desc>
  <rect width="1200" height="700" rx="26" fill="#f6f7f2"/>
  <text x="55" y="66" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#183a38">OpenLoom · Wiring</text>
  <text x="57" y="101" font-family="Arial, sans-serif" font-size="17" fill="#56716b">Connect each component to the ESP32 as shown. Buttons connect GPIO to GND when pressed.</text>
  <!-- ESP32 board -->
  <rect x="425" y="150" width="350" height="450" rx="28" fill="#247b67" stroke="#155b4c" stroke-width="5"/>
  <rect x="505" y="165" width="190" height="55" rx="8" fill="#d7d9d3" stroke="#a8afa8" stroke-width="3"/>
  <text x="600" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263d38">USB</text>
  <rect x="512" y="276" width="176" height="147" rx="12" fill="#1c3735" stroke="#88aa8d" stroke-width="3"/>
  <text x="600" y="339" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#e9eedb">ESP32</text>
  <text x="600" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#c5d5c6">DevKit</text>
  <!-- pin labels -->
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">
    <text x="442" y="260">3V3</text><text x="442" y="302">GND</text><text x="442" y="344">GPIO 21</text><text x="442" y="386">GPIO 22</text><text x="442" y="452">GPIO 18</text><text x="442" y="494">GPIO 19</text><text x="442" y="536">GPIO 23</text>
    <text x="704" y="260">GND</text>
  </g>
  <g fill="#f0c96c" stroke="#fff4cb" stroke-width="2"><circle cx="489" cy="255" r="6"/><circle cx="489" cy="297" r="6"/><circle cx="489" cy="339" r="6"/><circle cx="489" cy="381" r="6"/><circle cx="489" cy="447" r="6"/><circle cx="489" cy="489" r="6"/><circle cx="489" cy="531" r="6"/><circle cx="710" cy="255" r="6"/></g>
  <!-- OLED -->
  <rect x="60" y="178" width="245" height="155" rx="18" fill="#263b3a" stroke="#152a29" stroke-width="4"/>
  <rect x="78" y="195" width="209" height="113" rx="7" fill="#18332f" stroke="#77937e" stroke-width="2"/>
  <text x="182" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f0d47a">SSD1306 OLED</text>
  <text x="182" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#d8e6d0">128 × 64 · I²C</text>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#29443d"><text x="72" y="365">VCC</text><text x="124" y="365">GND</text><text x="188" y="365">SDA</text><text x="248" y="365">SCL</text></g>
  <!-- OLED wire lines -->
  <path d="M80 380 H340 V255 H489" fill="none" stroke="#d84f47" stroke-width="4"/>
  <path d="M139 380 H360 V297 H489" fill="none" stroke="#39454a" stroke-width="4"/>
  <path d="M208 380 H380 V339 H489" fill="none" stroke="#e3a928" stroke-width="4"/>
  <path d="M265 380 H400 V381 H489" fill="none" stroke="#547fca" stroke-width="4"/>
  <!-- buttons -->
  <text x="922" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183a38">MOMENTARY BUTTONS</text>
  <rect x="842" y="202" width="160" height="78" rx="14" fill="#ffffff" stroke="#9ab4a1" stroke-width="3"/>
  <circle cx="883" cy="241" r="20" fill="#d66e4b"/><text x="916" y="247" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263b38">FLIP</text>
  <rect x="842" y="317" width="160" height="78" rx="14" fill="#ffffff" stroke="#9ab4a1" stroke-width="3"/>
  <circle cx="883" cy="356" r="20" fill="#5b9c77"/><text x="916" y="362" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263b38">NEXT</text>
  <path d="M842 241 H810 V447 H489" fill="none" stroke="#d66e4b" stroke-width="4"/>
  <path d="M842 356 H825 V489 H489" fill="none" stroke="#5b9c77" stroke-width="4"/>
  <text x="850" y="422" font-family="Arial, sans-serif" font-size="15" fill="#45615a">Other terminal of each</text><text x="850" y="443" font-family="Arial, sans-serif" font-size="15" fill="#45615a">button → GND (GPIO</text><text x="850" y="464" font-family="Arial, sans-serif" font-size="15" fill="#45615a">uses internal pull-up).</text>
  <!-- buzzer -->
  <circle cx="941" cy="548" r="44" fill="#e9c963" stroke="#a98a36" stroke-width="4"/>
  <circle cx="941" cy="548" r="23" fill="#4c5145"/>
  <text x="941" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183a38">ACTIVE BUZZER</text>
  <path d="M898 548 H820 V531 H489" fill="none" stroke="#e3a928" stroke-width="4"/>
  <path d="M984 548 H1025 V255 H710" fill="none" stroke="#39454a" stroke-width="4"/>
  <text x="1005" y="518" font-family="Arial, sans-serif" font-size="14" fill="#45615a">+ to GPIO 23</text><text x="1028" y="302" font-family="Arial, sans-serif" font-size="14" fill="#45615a">− to GND</text>
  <rect x="55" y="635" width="1090" height="38" rx="10" fill="#e4eee2"/>
  <text x="600" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#35564c">OLED: VCC → 3.3V · GND → GND · SDA → GPIO 21 · SCL → GPIO 22</text>
</svg>
